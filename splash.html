<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CINEVERSE</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle,
                    rgba(229, 9, 20, 0.18),
                    black 65%
                );

            color: white;
            overflow: hidden;
        }

        .logo{
            color: #e50914;
            font-size: clamp(42px, 10vw, 80px);
            font-weight: bold;
            letter-spacing: 5px;

            text-shadow:
                0 0 10px #e50914,
                0 0 25px rgba(229, 9, 20, 0.8);

            animation: logoZoom 1.8s ease;
        }

        .tagline{
            margin-top: 14px;
            color: #cccccc;
            font-size: 16px;
            letter-spacing: 2px;

            animation: fadeIn 2s ease;
        }

        .loader{
            width: 42px;
            height: 42px;

            margin-top: 30px;

            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #e50914;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .loading-text{
            margin-top: 14px;
            color: #bbbbbb;
            font-size: 14px;
            letter-spacing: 1px;

            animation: fadeIn 2s ease;
        }

        @keyframes logoZoom{

            0%{
                opacity: 0;
                transform: scale(0.3);
            }

            70%{
                opacity: 1;
                transform: scale(1.08);
            }

            100%{
                transform: scale(1);
            }

        }

        @keyframes fadeIn{

            from{
                opacity: 0;
            }

            to{
                opacity: 1;
            }

        }

        @keyframes spin{

            to{
                transform: rotate(360deg);
            }

        }

        @media(max-width: 768px){

            .logo{
                letter-spacing: 2px;
            }

            .tagline{
                font-size: 13px;
            }

        }

    </style>

</head>

<body>
    <audio id="introSound" preload="auto">
    <source src="sounds/cineverse-intro.wav" type="audio/wav">
</audio>

    <h1 class="logo">
        CINEVERSE
    </h1>

    <p class="tagline">
        UNLIMITED MOVIES & ENTERTAINMENT
    </p>

    <div class="loader"></div>

    <p class="loading-text">
        Loading your experience...
    </p>

    <script>

const intro = document.getElementById("introSound");

window.onload = () => {

    intro.volume = 0.7;

    intro.play().catch(() => {
        console.log("Autoplay blocked");
    });

    setTimeout(() => {

        window.location.replace("home.html");

    }, 2500);

};

</script>

</body>

</html>
