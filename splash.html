<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CINEVERSE</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle,
                    rgba(229, 9, 20, 0.18),
                    black 65%
                );

            color: white;
            overflow: hidden;

            transition: opacity 0.5s ease;
        }

        .logo{
            color: #e50914;

            font-size:
                clamp(42px, 10vw, 80px);

            font-weight: bold;
            letter-spacing: 5px;

            text-shadow:
                0 0 10px #e50914,
                0 0 25px rgba(229, 9, 20, 0.8),
                0 0 45px rgba(229, 9, 20, 0.5);

            animation:
                intro 1.8s ease forwards;
        }

        .tagline{
            margin-top: 14px;

            color: #cccccc;
            font-size: 16px;
            letter-spacing: 2px;

            animation:
                fadeIn 1.8s ease forwards;
        }

        .loader{
            width: 42px;
            height: 42px;

            margin-top: 30px;

            border:
                4px solid
                rgba(255, 255, 255, 0.2);

            border-top-color: #e50914;
            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        .loading-text{
            margin-top: 14px;

            color: #bbbbbb;
            font-size: 14px;
            letter-spacing: 1px;

            animation:
                fadeIn 1.8s ease forwards;
        }

        @keyframes intro{

            0%{
                opacity: 0;
                transform: scale(0.3);
            }

            55%{
                opacity: 1;
                transform: scale(1.15);

                text-shadow:
                    0 0 18px #e50914,
                    0 0 40px rgba(229, 9, 20, 0.95);
            }

            100%{
                opacity: 1;
                transform: scale(1);

                text-shadow:
                    0 0 10px #e50914,
                    0 0 25px rgba(229, 9, 20, 0.8),
                    0 0 45px rgba(229, 9, 20, 0.5);
            }

        }

        @keyframes fadeIn{

            from{
                opacity: 0;
                transform: translateY(10px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes fadeOut{

            from{
                opacity: 1;
                transform: scale(1);
            }

            to{
                opacity: 0;
                transform: scale(0.9);
            }

        }

        @keyframes spin{

            to{
                transform: rotate(360deg);
            }

        }

        @media(max-width: 768px){

            .logo{
                letter-spacing: 2px;
            }

            .tagline{
                padding: 0 20px;
                font-size: 13px;
                text-align: center;
            }

            .loading-text{
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <audio
        id="introSound"
        preload="auto"
    >
        <source
            src="sounds/cineverse-intro.wav"
            type="audio/wav"
        >
    </audio>

    <h1 class="logo">
        CINEVERSE
    </h1>

    <p class="tagline">
        UNLIMITED MOVIES & ENTERTAINMENT
    </p>

    <div class="loader"></div>

    <p class="loading-text">
        Loading your experience...
    </p>

    <script>

        window.addEventListener(
            "load",
            async () => {

                const introSound =
                    document.getElementById(
                        "introSound"
                    );

                const logo =
                    document.querySelector(
                        ".logo"
                    );

                const tagline =
                    document.querySelector(
                        ".tagline"
                    );

                const loader =
                    document.querySelector(
                        ".loader"
                    );

                const loadingText =
                    document.querySelector(
                        ".loading-text"
                    );

                introSound.volume = 0.7;

                try {

                    await introSound.play();

                } catch (error) {

                    console.log(
                        "Autoplay blocked:",
                        error
                    );

                }

                // 1.7 seconds tarvata
                // logo, tagline and loading elements fade-out
                setTimeout(() => {

                    logo.style.animation =
                        "fadeOut 0.8s ease forwards";

                    tagline.style.animation =
                        "fadeOut 0.8s ease forwards";

                    loader.style.animation =
                        "fadeOut 0.8s ease forwards";

                    loadingText.style.animation =
                        "fadeOut 0.8s ease forwards";

                }, 1700);

                // Background smooth fade
                setTimeout(() => {

                    document.body.style.opacity =
                        "0";

                }, 2200);

                // 2.6 seconds tarvata home page
                setTimeout(() => {

                    window.location.replace(
                        "home.html"
                    );

                }, 2600);

            }
        );

    </script>

</body>

</html>
